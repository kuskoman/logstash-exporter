apiVersion: v2
name: logstash-integration-test-chart
description: Helm chart for testing the logstash-exporter Helm chart
type: application
version: 0.1.0
dependencies:
  - name: prometheus
    version: "^29.37.0"
    repository: https://prometheus-community.github.io/helm-charts
    condition: prometheus.enabled
  - name: logstash-exporter
    # The chart version follows the release tag, so it can be a prerelease (2.0.0-preN).
    # "*" never matches prereleases; a constraint with a prerelease suffix does.
    version: ">=0.0.0-0"
    repository: file://../../chart/
    condition: logstash-exporter.enabled
