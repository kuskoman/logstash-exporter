logstash:
  enabled: true
  image: docker.elastic.co/logstash/logstash:9.5.5
  javaOpts: "-Xms256m -Xmx256m"
  pipeline: |
    input {
        generator {
            message => '{"message": "dummy log"}'
        }
    }

    filter {
        json {
            source => "message"
        }
    }

    output {
        null {}
    }

prometheus:
  enabled: true
  alertmanager:
    enabled: false
  kube-state-metrics:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  service:
    type: ClusterIP
  config: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: "logstash-exporter"
        scrape_interval: 5s
        scrape_timeout: 5s
        metrics_path: "/metrics"
        scheme: "http"
        static_configs:
          - targets: ["logstash-exporter:9198"]

logstash-exporter:
  enabled: true
  fullnameOverride: logstash-exporter
  logstash:
    instances:
      - url: http://logstash:9600
  image:
    repository: logstash-exporter
    tag: latest
    pullPolicy: IfNotPresent
