name: Clean up untagged container images

# Every push to master retags the ghcr.io "master" images, which leaves the
# previous images untagged. This removes untagged images while keeping the
# platform images that tagged multi-architecture images refer to.

on:
  schedule:
    - cron: "23 4 * * 0"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Only log what would be deleted"
        type: boolean
        default: true

permissions:
  packages: write

jobs:
  cleanup:
    name: Delete untagged images
    runs-on: ubuntu-24.04
    steps:
      - name: Delete untagged images
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          packages: logstash-exporter,logstash-exporter-controller
          delete-untagged: true
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
          # The images are pushed with GH_PAT, so use it to manage them as well
          token: ${{ secrets.GH_PAT }}
