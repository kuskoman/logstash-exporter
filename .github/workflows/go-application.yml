name: Go application CI/CD

on:
  push:
    branches:
      - master
      - v1
    tags:
      - "*"
  pull_request:
    branches:
      - master
      - v1

env:
  TAG_NAME: "${GITHUB_REF##*/}"

jobs:
  lint:
    name: Lint code
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Golang with cache
        uses: magnetikonline/action-golang-cache@v5
        with:
          go-version: "^1.27"

      - name: Lint code using golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "These files are not formatted, run gofmt -w on them:"
            echo "$unformatted"
            exit 1
          fi

  lint-scripts:
    name: Lint scripts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0

  test:
    name: Unit test code
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Golang with cache
        uses: magnetikonline/action-golang-cache@v5
        with:
          go-version: "^1.27"

      - name: Test code
        run: go test $(go list ./... | grep -v '/test/e2e') -covermode=atomic -coverprofile=coverage.out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7

  test-e2e:
    name: E2E test code
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Golang with cache
        uses: magnetikonline/action-golang-cache@v5
        with:
          go-version: "^1.27"

      - name: Build e2e binary with the race detector
        run: make e2e-prepare
        env:
          GOFLAGS: -race

      - name: Run e2e tests with the race detector
        run: go test -race -v -timeout 10m -parallel 4 -shuffle=on ./test/e2e

  verify-helm-readme:
    name: Verify that Helm README is up to date
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install README generator
        run: make install-helm-readme

      - name: Generate README
        run: make helm-readme

      - name: Verify that there are no changes
        run: git diff --exit-code || (echo "README.md is not up to date. Please use helm-readme and commit the changes." && exit 1)

  verify-makefile-readme:
    name: Verify that Makefile section of README is up to date
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Generate README
        run: make update-readme-descriptions

      - name: Verify that there are no changes
        run: git diff --exit-code || (echo "README.md is not up to date. Please use update-readme-descriptions and commit the changes." && exit 1)

  lint-helm-chart:
    name: Lint Helm chart
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.1

      - name: Lint Helm chart
        working-directory: ./chart
        run: helm lint .

  template-helm-chart:
    name: Verify templating chart with default values
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.1

      - name: Template Helm chart
        working-directory: ./chart
        run: helm template . > /dev/null

  helm-unittest:
    name: Run Helm unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.1

      - name: Install Helm unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.2.1 --verify=false

      - name: Run Helm unit tests
        run: make helm-test

  test-integration:
    name: Test integration with Prometheus
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Compose
        uses: ndeloof/install-compose-action@v0.0.1
        with:
          version: v5.6.0
          legacy: true

      - name: Print compose version
        run: docker-compose version

      - name: Wait for compose
        run: make wait-for-compose

      - name: Print compose logs if failed
        run: docker-compose logs
        if: failure()

      - name: Print exporter logs if failed
        run: docker-compose logs exporter
        if: failure()

      - name: Run metrics integration test
        run: make verify-metrics

      - name: Generate metric names for README
        run: ./scripts/add_metrics_to_readme.sh

      - name: Verify that there are no changes
        run: git diff --exit-code || echo "README.md is not up to date. Please use add_metrics_to_readme.sh and commit the changes."

      - name: Shutdown compose
        run: docker-compose down -v

  build-linux:
    name: Build Linux binary
    runs-on: ubuntu-24.04
    needs: [lint, test, test-e2e]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Golang with cache
        uses: magnetikonline/action-golang-cache@v5
        with:
          go-version: "^1.27"

      - name: Build Linux binary
        run: make build-linux
        env:
          VERSION: ${{ github.ref }}

      - name: Upload Linux binary
        uses: actions/upload-artifact@v7
        with:
          name: logstash-exporter-linux
          path: |
            out/exporter-linux
            out/controller-linux

  build-linux-arm:
    name: Build Linux ARM binary
    runs-on: ubuntu-24.04
    needs: [lint, test, test-e2e]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Golang with cache
        uses: magnetikonline/action-golang-cache@v5
        with:
          go-version: "^1.27"

      - name: Build Linux ARM binary
        run: make build-linux-arm
        env:
          VERSION: ${{ github.ref }}

      - name: Upload Linux ARM binary
        uses: actions/upload-artifact@v7
        with:
          name: logstash-exporter-linux-arm
          path: |
            out/exporter-linux-arm
            out/controller-linux-arm

  build-darwin:
    name: Build Mac binary
    runs-on: ubuntu-24.04
    needs: [lint, test, test-e2e]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Golang with cache
        uses: magnetikonline/action-golang-cache@v5
        with:
          go-version: "^1.27"

      - name: Build Mac binary
        run: make build-darwin
        env:
          VERSION: ${{ github.ref }}

      - name: Upload Mac binary
        uses: actions/upload-artifact@v7
        with:
          name: logstash-exporter-darwin
          path: out/exporter-darwin

  build-windows:
    name: Build Windows binary
    runs-on: ubuntu-24.04
    needs: [lint, test, test-e2e]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Golang with cache
        uses: magnetikonline/action-golang-cache@v5
        with:
          go-version: "^1.27"

      - name: Build Windows binary
        run: make build-windows
        env:
          VERSION: ${{ github.ref }}

      - name: Upload Windows binary
        uses: actions/upload-artifact@v7
        with:
          name: logstash-exporter-windows
          path: out/exporter-windows

  build-linux-docker-image:
    name: Build and push Docker image (${{ matrix.component }})
    runs-on: ubuntu-24.04
    needs: [build-linux]
    strategy:
      matrix:
        component: [exporter, controller]
        include:
          - component: exporter
            dockerfile: Dockerfile
            image_name: logstash-exporter
            artifact_name: logstash-exporter-docker-image
            tar_name: logstash-exporter.tar.gz
          - component: controller
            dockerfile: Dockerfile.controller
            image_name: logstash-exporter-controller
            artifact_name: logstash-exporter-controller-docker-image
            tar_name: logstash-exporter-controller.tar.gz
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t ${{ matrix.image_name }}:latest --build-arg VERSION=${{ env.TAG_NAME }} --build-arg GIT_COMMIT=${GITHUB_SHA} -f ${{ matrix.dockerfile }} .

      - name: Package Docker image
        run: docker save ${{ matrix.image_name }}:latest | gzip > ${{ matrix.tar_name }}

      - name: Upload Docker image as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.tar_name }}
          retention-days: 1

      - name: Login to GitHub registry
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master'
        run: echo ${{ secrets.GH_PAT }} | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

      - name: Login to Docker Hub
        if: startsWith(github.ref, 'refs/tags/')
        run: echo ${{ secrets.DOCKER_HUB_PAT }} | docker login -u ${{ github.repository_owner }} --password-stdin

      - name: Tag Docker image with master
        if: github.ref == 'refs/heads/master'
        run: docker tag ${{ matrix.image_name }}:latest ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}${{ matrix.component == 'controller' && '-controller' || '' }}:master

      - name: Tag Docker image with tag to Docker Hub
        if: startsWith(github.ref, 'refs/tags/')
        run: docker tag ${{ matrix.image_name }}:latest ${{ github.repository_owner }}/${{ github.event.repository.name }}${{ matrix.component == 'controller' && '-controller' || '' }}:${{ env.TAG_NAME }}

      - name: Tag Docker image with tag to ghcr.io
        if: startsWith(github.ref, 'refs/tags/')
        run: docker tag ${{ matrix.image_name }}:latest ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}${{ matrix.component == 'controller' && '-controller' || '' }}:${{ env.TAG_NAME }}

      - name: Push Docker image to GitHub registry
        if: github.ref == 'refs/heads/master'
        run: docker push ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}${{ matrix.component == 'controller' && '-controller' || '' }}:master

      - name: Push Docker image with tag to Docker Hub
        if: startsWith(github.ref, 'refs/tags/')
        run: docker push ${{ github.repository_owner }}/${{ github.event.repository.name }}${{ matrix.component == 'controller' && '-controller' || '' }}:${{ env.TAG_NAME }}

      - name: Push Docker image with tag to ghcr.io
        if: startsWith(github.ref, 'refs/tags/')
        run: docker push ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}${{ matrix.component == 'controller' && '-controller' || '' }}:${{ env.TAG_NAME }}

  build-docker-linux-arm-image:
    name: Build and push multi-arch Docker image (${{ matrix.component }})
    runs-on: ubuntu-24.04
    needs: [build-linux-arm]
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        component: [exporter, controller]
        include:
          - component: exporter
            dockerfile: Dockerfile
            image_name: logstash-exporter
          - component: controller
            dockerfile: Dockerfile.controller
            image_name: logstash-exporter-controller
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: startsWith(github.ref, 'refs/tags/')
        run: echo ${{ secrets.DOCKER_HUB_PAT }} | docker login -u ${{ github.repository_owner }} --password-stdin

      - name: Login to GitHub registry
        if: startsWith(github.ref, 'refs/tags/')
        run: echo ${{ secrets.GH_PAT }} | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ github.repository_owner }}/${{ github.event.repository.name }}${{ matrix.component == 'controller' && '-controller' || '' }}:${{ env.TAG_NAME }}
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}${{ matrix.component == 'controller' && '-controller' || '' }}:${{ env.TAG_NAME }}
          build-args: |
            VERSION=${{ env.TAG_NAME }}
            GIT_COMMIT=${{ github.sha }}

  test-helm-integration:
    name: Test integration with Helm chart
    runs-on: ubuntu-24.04
    needs:
      - verify-helm-readme
      - lint-helm-chart
      - template-helm-chart
      - helm-unittest
      - build-linux-docker-image
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download Exporter Docker image
        uses: actions/download-artifact@v8
        with:
          name: logstash-exporter-docker-image
          path: .helm/files

      - name: Load Docker image
        run: docker load -i .helm/files/logstash-exporter.tar.gz

      - name: Download Controller Docker image
        uses: actions/download-artifact@v8
        with:
          name: logstash-exporter-controller-docker-image
          path: .helm/files

      - name: Load Controller Docker image
        run: docker load -i .helm/files/logstash-exporter-controller.tar.gz

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.1

      - name: Include current chart versions
        working-directory: .helm/logstash-integration-test-chart
        run: helm dependency update

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1.15.1
        with:
          cluster_name: kind-chart-testing

      - name: Export Docker images to Kind cluster
        run: |
          kind load docker-image logstash-exporter:latest --name kind-chart-testing
          kind load docker-image logstash-exporter-controller:latest --name kind-chart-testing

      - name: Template Helm chart
        working-directory: .helm/logstash-integration-test-chart
        run: helm template .

      - name: Install Helm chart
        working-directory: .helm/logstash-integration-test-chart
        run: helm install --wait --timeout 10m --debug logstash-integration-test-chart .

      - name: Install Helm chart in Kubernetes controller mode
        run: |
          helm install --wait --timeout 5m controller-test ./chart \
            --set logstash.kubernetes.enabled=true \
            --set serviceAccount.enabled=true \
            --set serviceAccount.create=true \
            --set rbac.create=true \
            --set image.repository=logstash-exporter \
            --set image.controllerRepository=logstash-exporter-controller \
            --set image.tag=latest

      - name: Verify that the controller discovers the annotated Logstash pod
        run: ./scripts/verify_k8s_controller.sh controller-test-logstash-exporter

      - name: Print exporter logs
        run: kubectl logs -n default -l app=logstash-exporter --all-containers --prefix
        if: failure()

      - name: Print Logstash logs
        run: kubectl logs -n default -l app=logstash-integration-test-chart-logstash --tail=200
        if: failure()

  create-release:
    name: Create GitHub release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    needs:
      - build-linux
      - build-darwin
      - build-windows
      - build-linux-arm
      - build-linux-docker-image
      - build-docker-linux-arm-image
      - test-integration
      - lint-scripts
      - verify-makefile-readme
      - test-helm-integration
      - helm-unittest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Output tag information
        run: |
          echo "Tag name: ${{ env.TAG_NAME }}"
          echo "Tag ref: ${{ github.ref }}"
      - name: Generate release notes
        run: ./scripts/create_release_notes.sh
      - name: Determine if prerelease
        id: prerelease
        run: |
          # Tags with a suffix, such as v2.0.0-pre12, are pre-releases
          if [[ "${{ env.TAG_NAME }}" =~ ^v.*-.*$ ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GH_PAT }}
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: "./release_notes.txt"
          draft: false
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}

  publish-helm-chart:
    name: Publish Helm chart
    runs-on: ubuntu-24.04
    # Publish the chart only with a release, after the images it refers to
    # have been pushed
    needs:
      - create-release
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write # to push chart release and create a release (helm/chart-releaser-action)
      packages: write # needed for ghcr access
      id-token: write # needed for keyless signing
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check that the chart version matches the release
        run: |
          app_version=$(yq '.appVersion' chart/Chart.yaml)
          if [ "v${app_version}" != "${{ env.TAG_NAME }}" ]; then
            echo "chart/Chart.yaml appVersion ${app_version} does not match the release ${{ env.TAG_NAME }}."
            echo "Create releases with ./scripts/release_tag.sh, which updates the chart version."
            exit 1
          fi

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.1

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1
        with:
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CR_GENERATE_RELEASE_NOTES: true

      # see https://github.com/helm/chart-releaser/issues/183
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push charts to GHCR
        run: |
          shopt -s nullglob
          for pkg in .cr-release-packages/*; do
            if [ -z "${pkg:-}" ]; then
              break
            fi
            helm push "${pkg}" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"
          done

  upload-binaries:
    strategy:
      matrix:
        binary: [linux, darwin, windows, linux-arm]
    runs-on: ubuntu-24.04
    needs:
      - create-release
      - build-linux
      - build-darwin
      - build-windows
      - build-linux-arm
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          name: logstash-exporter-${{ matrix.binary }}
      - name: Name binaries and generate sha256 checksums
        run: |
          mv "exporter-${{ matrix.binary }}" "logstash-exporter-${{ matrix.binary }}"
          # The controller runs in Kubernetes, so it is only built for Linux
          if [ -f "controller-${{ matrix.binary }}" ]; then
            mv "controller-${{ matrix.binary }}" "logstash-exporter-controller-${{ matrix.binary }}"
          fi
          for binary in logstash-exporter-*; do
            sha256sum "$binary" > "$binary.sha256"
          done
      - name: Upload binaries to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GH_PAT }}
          tag_name: ${{ github.ref_name }}
          files: logstash-exporter-*