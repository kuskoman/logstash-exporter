suite: Service Tests
templates:
  - service.yaml
release:
  name: logstash-exporter-test
  namespace: default

tests:
  - it: should create a service with default settings
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: logstash-exporter-test
      - equal:
          path: metadata.labels
          value:
            app: logstash-exporter
            release: logstash-exporter-test
      - notExists:
          path: metadata.annotations
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports
          value:
            - name: http
              port: 9198
              protocol: TCP

  - it: should select the exporter pods
    asserts:
      - equal:
          path: spec.selector
          value:
            app: logstash-exporter
            release: logstash-exporter-test

  - it: should set service type when specified
    set:
      service.type: NodePort
    asserts:
      - equal:
          path: spec.type
          value: NodePort

  - it: should set port when specified
    set:
      service.port: 8080
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 8080

  - it: should add annotations when specified
    set:
      service.annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9198"
    asserts:
      - equal:
          path: metadata.annotations
          value:
            prometheus.io/scrape: "true"
            prometheus.io/port: "9198"

  - it: should add labels when specified
    set:
      service.labels:
        environment: production
        tier: monitoring
    asserts:
      - equal:
          path: metadata.labels
          value:
            app: logstash-exporter
            release: logstash-exporter-test
            environment: production
            tier: monitoring
