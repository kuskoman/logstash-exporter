suite: ServiceAccount Tests
templates:
  - service-account.yaml
release:
  name: logstash-exporter-test
  namespace: default

tests:
  - it: should not create a service account by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should create a service account when enabled
    set:
      serviceAccount.create: true
      serviceAccount.enabled: true
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: logstash-exporter-test
      - equal:
          path: metadata.labels
          value:
            app: logstash-exporter
            release: logstash-exporter-test
      - notExists:
          path: metadata.annotations

  - it: should mount the service account token by default
    set:
      serviceAccount.create: true
      serviceAccount.enabled: true
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: true

  - it: should not mount the service account token when disabled
    set:
      serviceAccount.create: true
      serviceAccount.enabled: true
      serviceAccount.automountServiceAccountToken: false
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: should use a custom name when provided
    set:
      serviceAccount.create: true
      serviceAccount.enabled: true
      serviceAccount.name: custom-sa
    asserts:
      - equal:
          path: metadata.name
          value: custom-sa

  - it: should not create a service account when only create is set
    set:
      serviceAccount.create: true
      serviceAccount.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should not create a service account when using an existing one
    set:
      serviceAccount.create: false
      serviceAccount.enabled: true
      serviceAccount.name: existing-sa
    asserts:
      - hasDocuments:
          count: 0

  - it: should add annotations when provided
    set:
      serviceAccount.create: true
      serviceAccount.enabled: true
      serviceAccount.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/logstash-exporter
    asserts:
      - equal:
          path: metadata.annotations
          value:
            eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/logstash-exporter
