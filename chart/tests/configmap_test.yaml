suite: ConfigMap Tests
templates:
  - configmap.yaml
release:
  name: logstash-exporter-test
  namespace: default

tests:
  - it: should create a configmap with default settings
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: logstash-exporter-test
      - equal:
          path: metadata.labels
          value:
            app: logstash-exporter
            release: logstash-exporter-test
  
  - it: should create a configmap when kubernetes controller is enabled
    set:
      logstash.kubernetes.enabled: true
    asserts:
      - isKind:
          of: ConfigMap
  - it: should render logstash instances, server and logging in exporter mode
    asserts:
      - equal:
          path: data["config.yml"]
          value: |-
            logstash:
              instances:
                - url: http://logstash:9600
                - url: http://logstash2:9600
            server:
              host: "0.0.0.0"
              port: 9198
            logging:
              level: "info"

  - it: should render kubernetes configuration in controller mode
    set:
      logstash.kubernetes.enabled: true
      logstash.kubernetes.namespaces: ["default", "monitoring"]
      logstash.kubernetes.resources.services.enabled: true
    asserts:
      - equal:
          path: data["config.yml"]
          value: |-
            kubernetes:
              enabled: true
              logstashPasswordAnnotation: logstash-exporter.io/password
              logstashURLAnnotation: logstash-exporter.io/url
              logstashUsernameAnnotation: logstash-exporter.io/username
              namespaces:
              - default
              - monitoring
              resources:
                pods:
                  annotationPrefix: logstash-exporter.io
                  enabled: true
                services:
                  annotationPrefix: logstash-exporter.io
                  enabled: true
              resyncPeriod: 10m
              scrapeInterval: 15s
            server:
              host: "0.0.0.0"
              port: 9198
            logging:
              level: "info"

  - it: should keep server and logging settings in controller mode
    set:
      logstash.kubernetes.enabled: true
      logstash.server.port: 9200
      logstash.logging.level: debug
    asserts:
      - equal:
          path: data["config.yml"]
          value: |-
            kubernetes:
              enabled: true
              logstashPasswordAnnotation: logstash-exporter.io/password
              logstashURLAnnotation: logstash-exporter.io/url
              logstashUsernameAnnotation: logstash-exporter.io/username
              namespaces: []
              resources:
                pods:
                  annotationPrefix: logstash-exporter.io
                  enabled: true
                services:
                  annotationPrefix: logstash-exporter.io
                  enabled: false
              resyncPeriod: 10m
              scrapeInterval: 15s
            server:
              host: "0.0.0.0"
              port: 9200
            logging:
              level: "debug"

  - it: should use custom config when enabled
    set:
      logstash.kubernetes.enabled: true
      customConfig.enabled: true
      customConfig.config: |
        logstash:
          instances:
            - url: http://custom:9600
    asserts:
      - equal:
          path: data["config.yml"]
          value: |-
            logstash:
              instances:
                - url: http://custom:9600
