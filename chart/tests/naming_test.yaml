suite: Naming Tests
templates:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - service-account.yaml
  - cluster-role.yaml
  - service-monitor.yaml
set:
  serviceAccount.enabled: true
  serviceAccount.create: true
  rbac.create: true
  serviceMonitor.enabled: true

tests:
  - it: should use the release name when it contains the chart name
    release:
      name: my-logstash-exporter
    asserts:
      - equal:
          path: metadata.name
          value: my-logstash-exporter

  - it: should prefix the chart name with the release name otherwise
    release:
      name: monitoring
    asserts:
      - equal:
          path: metadata.name
          value: monitoring-logstash-exporter

  - it: should use fullnameOverride when specified
    release:
      name: monitoring
    set:
      fullnameOverride: custom-exporter
    asserts:
      - equal:
          path: metadata.name
          value: custom-exporter

  - it: should truncate long names to 63 characters
    release:
      name: monitoring
    set:
      fullnameOverride: a-very-long-name-that-is-longer-than-the-kubernetes-limit-of-63-characters
    asserts:
      - equal:
          path: metadata.name
          value: a-very-long-name-that-is-longer-than-the-kubernetes-limit-of-63

  - it: should reference the overridden names in the deployment and role binding
    release:
      name: monitoring
    set:
      fullnameOverride: custom-exporter
    asserts:
      - template: deployment.yaml
        equal:
          path: spec.template.spec.serviceAccountName
          value: custom-exporter
      - template: cluster-role.yaml
        documentIndex: 1
        equal:
          path: roleRef.name
          value: custom-exporter
      - template: deployment.yaml
        equal:
          path: spec.template.spec.volumes[0].configMap.name
          value: custom-exporter
      - template: cluster-role.yaml
        documentIndex: 1
        equal:
          path: subjects[0].name
          value: custom-exporter
